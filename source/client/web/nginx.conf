# Serves the built React app and forwards the API and the game WebSocket to the server container.
# The page and the API share one origin, so the browser needs no CORS. $http_host keeps the port the
# browser used, which the server needs to recognise the WebSocket handshake as same-origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
